<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>翻译设置</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #222;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      color: #444;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    select,
    input[type='text'],
    input[type='password'] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    .llm-box {
      padding: 10px;
      background: #f5f7fa;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      margin-top: 8px;
      text-align: center;
      color: #16a34a;
      height: 16px;
    }
  </style>
</head>

<body>
  <h3>My Translator 设置</h3>

  <div class="row">
    <label for="enabled" style="margin: 0; font-weight: 600;">开启翻译</label>
    <input type="checkbox" id="enabled" />
  </div>

  <div class="field">
    <label for="sourceLang">源语言</label>
    <select id="sourceLang">
      <option value="en">英语 (en)</option>
      <option value="ja">日语 (ja)</option>
      <option value="zh-CN">中文 (zh-CN)</option>
    </select>
  </div>

  <div class="field">
    <label for="targetLang">目标语言</label>
    <select id="targetLang">
      <option value="zh-CN">简体中文</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
    </select>
  </div>

  <div class="field">
    <label for="provider">翻译引擎</label>
    <select id="provider">
      <option value="mymemory">MyMemory (免费测试)</option>
      <option value="llm">大模型 API (OpenAI 兼容)</option>
    </select>
  </div>

  <div id="llmConfig" class="llm-box" style="display: none;">
    <div class="field">
      <label for="apiUrl">API 地址</label>
      <input type="text" id="apiUrl" placeholder="https://api.deepseek.com/chat/completions" />
    </div>
    <div class="field">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
    </div>
    <div class="field" style="margin-bottom: 0;">
      <label for="model">模型名称</label>
      <input type="text" id="model" placeholder="deepseek-chat" />
    </div>
  </div>

  <button id="saveBtn">保存配置</button>
  <div id="status"></div>

  <script type="module" src="./main.ts"></script>
</body>

</html>
